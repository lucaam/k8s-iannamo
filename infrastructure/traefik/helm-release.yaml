apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 42.1.3
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  install:
    crds: Skip
  values:
    # --- LOGGING ---
    log:
      level: WARN

    accessLog:
      enabled: true

    # --- CRD ---
    # `crds` rimosso: non esiste più come valore della chart v34+.
    # I CRD sono gestiti da `upgrade.crds: Skip` / `install.crds: Skip` (sopra)
    # oppure dalla chart separata `traefik-crds` se vuoi installarli esplicitamente.

    # --- DEPLOYMENT ---
    deployment:
      replicas: 2

    # --- PROVIDERS ---
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true

    # --- PORTS ---
    ports:
      web:
        port: 8000
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 8443
        exposedPort: 443
        http:
          tls:
            enabled: true
          middlewares:
            - traefik-traefik-errors@kubernetescrd
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 600s
            writeTimeout: 600s

    # --- INGRESS ROUTE DASHBOARD ---
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${DOMAIN}`)
        entryPoints: ["websecure"]
        middlewares:
          - authentik-forward-auth@kubernetescrd
          - traefik-errors@kubernetescrd

    # --- GATEWAY ---
    gateway:
      namespacePolicy: All

    # --- SERVICE ---
    service:
      annotations:
        metallb.io/ip-allocated-from-pool: external-pool
        metallb.io/allow-shared-ip: external-pool
        metallb.io/loadBalancerIPs: 192.168.178.10

    # --- RESOURCES ---
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
