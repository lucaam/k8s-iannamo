apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gateway-api
  - cnpg
# Flux must never prune a CRD: deleting it deletes every object of that kind
# (CNPG Clusters and their PVCs, Gateways, HTTPRoutes). The patch selects
# CustomResourceDefinitions only, including the remote ones pulled in by the
# child kustomizations; the name below is ignored because a target is set.
# commonAnnotations is not used on purpose: it would also change the pod
# template of the CNPG operator Deployment and restart it.
# The same patch turns off postBuild substitution: CRDs never use ${VAR}, and
# their descriptions can contain text such as "${...}" that Flux fails to parse,
# which would stop the whole infrastructure Kustomization (CNPG 1.30 does).
patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
          kustomize.toolkit.fluxcd.io/substitute: disabled
