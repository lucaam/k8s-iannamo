apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.28/releases/cnpg-1.28.0.yaml
patches:
  # Operator resources sized from 30 days of usage. No CPU limit on purpose:
  # the upstream 100m limit throttled the operator and made its startup probe fail.
  - target:
      kind: Deployment
      name: cnpg-controller-manager
      namespace: cnpg-system
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 256Mi
