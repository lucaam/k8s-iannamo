# yamllint configuration, used by CI (lint job in .github/workflows/ci.yaml)
# and locally (`yamllint .`).
extends: default

ignore: |
  charts/
  clusters/production/flux-system/gotk-components.yaml
  *.sops.yaml

rules:
  document-start: disable
  # Long URLs and embedded configuration files.
  line-length: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false
  indentation:
    spaces: consistent
    indent-sequences: whatever
