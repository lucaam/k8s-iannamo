apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/secrets
  prune: false  # NEVER delete shared secrets
  # Deleting this Kustomization object (e.g. removing this file) keeps every
  # object it applied, even if prune is enabled later.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
