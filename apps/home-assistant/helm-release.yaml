apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 15m
  # A rollout replaces the single pod: old pod shutdown (up to the grace period
  # below) plus a startup of several minutes. The 5m default timed out (rev 106, 108).
  timeout: 15m
  chart:
    spec:
      chart: home-assistant
      version: "0.3.92"
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  postRenderers:
    - kustomize:
        patches:
          # The chart has no value for the pod grace period. 240s matches the
          # image's S6_SERVICES_GRACETIME and covers HA's own shutdown stages
          # (20+100+60+30s), so the SQLite recorder can close the database
          # cleanly instead of being killed after the 30s default.
          - target:
              kind: StatefulSet
              name: home-assistant
            patch: |
              - op: add
                path: /spec/template/spec/terminationGracePeriodSeconds
                value: 240

  values:
    # Image settings
    image:
      # Repository for the Home Assistant image
      repository: ghcr.io/home-assistant/home-assistant
      # Image pull policy
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: "2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847"
    # Environment variables
    env: []
    # Use environment variables from ConfigMaps or Secrets
    envFrom: []

    # Resource sizing inferred from Prometheus metrics (p95/p99 + safety).
    # 30-day working set: p95 3341Mi, max 3506Mi; CPU p95 102m, max 1089m.
    # No CPU limit: bursts at startup must not be throttled.
    resources:
      requests:
        cpu: 200m
        memory: 2560Mi
      limits:
        memory: 5Gi
    hostPort:
      # Enable 'hostPort' or not
      enabled: false
      port: 8123
    # Specifies if the containers should be started in hostNetwork mode.
    #
    # Required for use auto-discovery feature of Home Assistant
    hostNetwork: true
    # Set the dnsPolicy (you'll want ClusterFirstWithHostNet if running on hostNetwork to reac
    # other k8s services via DNS
    dnsPolicy: ClusterFirstWithHostNet
    # No "rotate" option: c-ares (HA's aiohttp resolver) honors it and would
    # spread queries over all three nameservers; the router and 1.1.1.1 answer
    # NXDOMAIN for *.cluster.local, which is final, so in-cluster lookups could
    # fail intermittently. Without it c-ares asks CoreDNS first and falls back
    # only on timeout or server failure. musl (getaddrinfo) ignores "rotate"
    # and queries all nameservers in parallel.
    dnsConfig:
      nameservers:
        - 10.96.0.10         # CoreDNS (primary)
        - 192.168.178.1      # Local router (fallback)
        - 1.1.1.1            # Cloudflare (external fallback)
      searches:
        - home-assistant.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      options:
        - name: ndots
          value: "2"
        - name: timeout
          value: "10"        # raised from 5 to 10
        - name: attempts
          value: "5"         # raised from 3 to 5
        - name: single-request-reopen
    service:
      # -- annotations for the service created
      annotations:
        metallb.io/ip-allocated-from-pool: external-pool
        metallb.io/allow-shared-ip: external-pool
        metallb.io/loadBalancerIPs: 192.168.178.12
      # -- type of Service to be created
      type: LoadBalancer
      # -- port in which the service will be listening
      port: 8080
    # Ingress settings
    # Node selector settings for scheduling the pod on specific nodes
    nodeSelector: {}
    # Tolerations settings for scheduling the pod based on node taints
    tolerations: []
    # Affinity settings for controlling pod scheduling
    affinity: {}
    # Set a priorityClassName on Home Assistant pods
    priorityClassName: ""
    # No permission-fixing init container. HA runs as root and the NFS export
    # does not squash root, so HA does not need uid 1000 ownership (that was
    # for code-server, now disabled). A recursive chown/chmod of
    # /config/www/community (~4200 entries, already 1000:1000 775) over NFS
    # added ~2 minutes to every start.
    initContainers: []
    # Configuration for Home Assistant
    configuration:
      # Enable or disable the configuration setup for Home Assistant
      enabled: true
      # Force init will merge the current configuration file with the default configuration on every start
      # This is useful when you want to ensure that the configuration file is always up to date
      # Force init can delay startup during upgrades; disable to speed readiness
      forceInit: false
      # List of trusted proxies in the format of CIDR notation in a case of using a reverse proxy
      # Here is the list of the most common private IP ranges, use your list of possible trusted proxies, usually, it's the IP of the reverse proxy
      trusted_proxies:
        - 10.0.0.0/8
        - 192.168.178.0/24
      # Template for the configuration.yaml file
      # Used the `tpl` function to render the template, so you can use Go template functions
      templateConfig: |-
        # Loads default set of integrations. Do not remove.
        default_config:

        {{- if or .Values.ingress.enabled .Values.ingress.external }}
        http:
          use_x_forwarded_for: true
          trusted_proxies:
            {{- range .Values.configuration.trusted_proxies }}
            - {{ . }}
            {{- end }}
        {{- end}}
        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
      # Init script for the Home Assistant initialization, you can use Go template functions
      # Script is executed before the Home Assistant container starts and is used to prepare the configuration
      # Will be executed only if the configuration.enabled is set to true
      initScript: |-
        #!/bin/sh
        set -e

        # Check if the configuration file exists
        if [ ! -f /config/configuration.yaml ]; then
          echo "Configuration file not found, creating a new one"
          cp /config-templates/configuration.yaml /config/configuration.yaml
        fi

        # Check if the force init is enabled
        forceInit="{{ .Values.configuration.forceInit }}"
        if [ "$forceInit" = "true" ]; then
          echo "Force init is enabled, overwriting the configuration file"
          current_time=$(date +%Y%m%d_%H%M%S)
          echo "Backup the current configuration file to configuration.yaml.$current_time"
          cp /config/configuration.yaml /config/configuration.yaml.$current_time
          echo "Before cleanup - all backup files:"
          ls -l /config/configuration.yaml.*
          echo "Cleaning up - keeping only 10 most recent backups..."
          ls -t /config/configuration.yaml.* 2>/dev/null | tail -n +11 | xargs -r rm
          echo "After cleanup - remaining backup files:"
          ls -l /config/configuration.yaml.*
          echo "The current configuration file will be merged with the default configuration file with this content:"
          cat /config-templates/configuration.yaml
          if [ ! -s /config/configuration.yaml ]; then
            # If /config/configuration.yaml is empty, use the content of /config-templates/configuration.yaml
            cat /config-templates/configuration.yaml > /config/configuration.yaml
          else
            # Perform the merge operation if /config/configuration.yaml is not empty
            yq eval-all --inplace 'select(fileIndex == 0) *d select(fileIndex == 1)' /config/configuration.yaml /config-templates/configuration.yaml
          fi
        fi

        # Check if the automations file exists
        if [ ! -f /config/automations.yaml ]; then
          echo "Automations file not found, creating a new one"
          touch /config/automations.yaml
          echo "[]" >> /config/automations.yaml
        fi

        # Check if the scripts file exists
        if [ ! -f /config/scripts.yaml ]; then
          echo "Scripts file not found, creating a new one"
          touch /config/scripts.yaml
        fi

        # Check if the scenes file exists
        if [ ! -f /config/scenes.yaml ]; then
          echo "Scenes file not found, creating a new one"
          touch /config/scenes.yaml
        fi
      initContainer:
        name: setup-config
        image: mikefarah/yq:4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2
        securityContext:
          runAsUser: 0
        command: ["/bin/sh", "-c"]
        args:
          - /bin/sh /mnt/init/init.sh
        # env:
        # - name: FORCE_INIT
        #   valueFrom:
        #     configMapKeyRef:
        #       name: init-script
        #       key: forceInit
        # Home Assistant configuration volume will be mounted to /config automatically
        volumeMounts:
          - name: init-volume
            mountPath: /mnt/init/init.sh
            subPath: init.sh
          - name: config-volume
            mountPath: /config-templates
    # Persistence values for the Home Assistant instance
    persistence:
      # Enable or disable persistence
      enabled: true
      # Access mode for the persistent volume claim
      accessMode: ReadWriteMany
      # Size of the persistent volume claim
      size: 5Gi
      # Storage class for the persistent volume claim
      storageClass: "nfs-spacex"
      # Name of the existing volume for the StatefulSet, this option can be used to bind to an existing PV
      existingVolume: ""
      # Name of the existing PVC to use with Deployment, this option can be used to use an existing PVC
      existingClaim: ""
      # Annotations to add to the persistent volume claim
      annotations: {}
      #  k8up.io/backup: "true"
      #  another-annotation: "value"
      ## Persistent Volume selectors
      ## https://kubernetes.io/docs/concepts/storage/persistent-volumes/#selector
      matchLabels: {}
      matchExpressions: {}
    # if you need any additional volumes, you can define them here
    additionalVolumes: []
    # - name: custom-components
    #   emptyDir: {}

    # - hostPath:
    #     path: >-
    #       /dev/serial/by-id/usb-Silicon_Labs_Sonoff_Zigbee_3.0_USB_Dongle_Plus_0001-if00-port0
    #     type: CharDevice
    #   name: usb
    # if you need any additional volume mounts, you can define them here
    additionalMounts: []
    # - mountPath: /config/custom_components/panasonic_cc
    #   name: custom-components

    # - mountPath: /dev/ttyACM0
    #   name: usb

    # if you need to expose additional ports
    additionalPorts: []
    #  - name: sia
    #    containerPort: 8124
    #    protocol: TCP

    # if you need to expose additional services
    additionalServices: []
    #  - name: sia
    #    port: 8124
    #    targetPort: sia
    #    type: NodePort
    #    protocol: TCP
    #    nodePort: 30124

    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: http
        scheme: HTTP
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 2
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: http
        scheme: HTTP
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
    startupProbe:
      httpGet:
        path: /
        port: http
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
    # initialDelaySeconds: 1
    # periodSeconds: 5
    # timeoutSeconds: 1
    # successThreshold: 1
    # failureThreshold: 1
    # httpGet:
    #   scheme: HTTP
    #   path: /
    #   port: http

    serviceMonitor:
      # requires HA integration:  https://www.home-assistant.io/integrations/prometheus/
      enabled: true
      scrapeInterval: 30s
      scrapeTimeout: 10s
      path: /api/prometheus
      labels: {}
      # Bearer token authentication configuration
      bearerToken: {}
      # Name of the secret containing the bearer token
      # secretName: ""
      # Key in the secret containing the bearer token
      # secretKey: ""
    # Addons configuration for additional services
    addons:
      # code-server stays disabled: it ran with "--auth none" and, because the
      # pod uses hostNetwork, it was reachable from the whole LAN on
      # <node-ip>:12321, bypassing the Authentik-protected route. Edit /config
      # with kubectl exec/cp instead. Its data in /config/.vscode is kept.
      codeserver:
        enabled: false
