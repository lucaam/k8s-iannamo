
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 1h
  # pajikos.github.io (http or https) redirects to this custom domain over
  # plain http, so the https URL of the custom domain is used directly.
  url: https://blog.pavelsklenar.com/home-assistant-helm-chart
