apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 1m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ## This chart relies on the common library chart from bjw-s
    ## You can find it at https://github.com/bjw-s-labs/helm-charts/tree/common-4.3.0/charts/library/common
    ## Refer there for more detail about the supported values

    # These entries are shared between all the Immich components

    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: "ViT-B-32__openai"
              MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: "ViT-B-32__openai"
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: database-immich
                    key: DB_HOSTNAME
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: database-immich
                    key: DB_USERNAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: database-immich
                    key: DB_PASSWORD
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: database-immich
                    key: DB_DATABASE_NAME
              LOG_LEVEL: verbose
              TZ: Europe/Rome
    immich:
      metrics:
        # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
        enabled: true
      persistence:
        # Main data store for all photos shared between different components.
        library:
          # Automatically creating the library volume is not supported by this chart
          # You have to specify an existing PVC to use
          existingClaim: immich-library
      # configuration is immich-config.json converted to yaml
      # ref: https://immich.app/docs/install/config-file/
      #
      configuration: {}

    # Dependencies

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.2-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
                pullPolicy: IfNotPresent
              # No CPU limit on purpose: CFS throttling makes probes fail during bursts.
              resources:
                requests:
                  cpu: 10m
                  memory: 96Mi
                limits:
                  memory: 256Mi
      persistence:
        data:
          enabled: true
          # Optional: Set this to persistentVolumeClaim to keep job queues persistent
          type: persistentVolumeClaim
          storageClass: nfs-flash
          existingClaim: immich-valkey

    # Immich components

    server:
      enabled: true

      persistence:
        dri:
          type: hostPath
          hostPath: /dev/dri
          hostPathType: Directory
          globalMounts:
            - path: /dev/dri

      service:
        main:
          type: LoadBalancer
          annotations:
            metallb.io/ip-allocated-from-pool: external-pool
            metallb.io/loadBalancerIPs: 192.168.178.15

      controllers:
        main:
          # FIX: the nodeSelector goes here (controllers.main.pod), not in server.pod
          pod:
            nodeSelector:
              kubernetes.io/hostname: talos-homelab-worker-1
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
                pullPolicy: IfNotPresent
              securityContext:
                privileged: true
              # No CPU limit on purpose: CFS throttling makes probes fail during bursts.
              # The memory request is below p95 so that worker-1, where the pod is pinned, is not overcommitted.
              resources:
                requests:
                  cpu: 500m
                  memory: 1536Mi
                limits:
                  memory: 4608Mi
    machine-learning:
      enabled: true
      controllers:
        main:
          # Machine learning can wait: it never preempts other pods
          # (see infrastructure/priority-classes).
          pod:
            priorityClassName: homelab-low
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
                MACHINE_LEARNING_MODEL_REVISION: v2
              # No CPU limit on purpose: CFS throttling makes probes fail during bursts.
              resources:
                requests:
                  cpu: 50m
                  memory: 1Gi
                limits:
                  memory: 3Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-cache
