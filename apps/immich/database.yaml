apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: tensorchord/cloudnative-vectorchord:17-0.4.3
  instances: 2
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db-secret
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
  managed:
    roles:
      - name: immich
        passwordSecret:
          name: immich-db-secret
        # If the user needs superuser privileges, uncomment the following line
        superuser: true
        # Otherwise, for a regular user with login privileges, use:
        login: true
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  storage:
    storageClass: nfs-flash
    size: 32Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: immich
spec:
  name: immich
  owner: immich
  cluster:
    name: immich-pg
