apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 5m
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      version: "1.5.0"
  values:
    persistence:
      enabled: true
      existingClaim: gatus-data
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-spacex
      size: 200Mi

    # Un solo pod alla volta sul DB SQLite in /data: con RollingUpdate il pod
    # nuovo e quello vecchio (anche su nodi diversi) scriverebbero insieme
    # sullo stesso file NFS, cosa che SQLite in modalità WAL non supporta.
    deployment:
      strategy: Recreate

    # Service per Gatus
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080

    externalConfigMap: gatus

    # OIDC e Telegram arrivano dal secret gatus-secrets (SOPS) come env:
    # nella ConfigMap restano i placeholder ${VAR} (scritti $${VAR} per
    # saltare il postBuild di Flux) e Gatus li espande quando carica il
    # config. Così il token del bot non finisce in chiaro nella ConfigMap.
    env:
      OIDC_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: OIDC_CLIENT_ID
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: OIDC_CLIENT_SECRET
      TELEGRAM_BOT_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: TELEGRAM_CHAT_ID
