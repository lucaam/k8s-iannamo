apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 5m
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      version: "1.5.0"
  values:
    persistence:
      enabled: true
      existingClaim: gatus-data
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-spacex
      size: 200Mi

    # One pod at a time on the SQLite DB in /data: with RollingUpdate the new
    # and the old pod (possibly on different nodes) would write the same NFS
    # file at once, which SQLite in WAL mode does not support.
    deployment:
      strategy: Recreate

    # Service per Gatus
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080

    externalConfigMap: gatus

    # 30-day working set: p95 37Mi, max 46Mi; CPU p95 2m, max 9m.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # OIDC and Telegram values come as env vars from the gatus-secrets secret
    # (SOPS): the ConfigMap keeps only the env placeholders (written with a
    # double dollar sign to skip Flux postBuild) and Gatus expands them when it
    # loads the config, so the bot token never lands in the ConfigMap.
    env:
      OIDC_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: OIDC_CLIENT_ID
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: OIDC_CLIENT_SECRET
      TELEGRAM_BOT_TOKEN:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        valueFrom:
          secretKeyRef:
            name: gatus-secrets
            key: TELEGRAM_CHAT_ID
