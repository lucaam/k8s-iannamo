apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
data:
  config.yaml: |-
    # Gatus configuration with OIDC authentication
    # History is stored in SQLite on the gatus-data PVC, mounted by the chart at
    # persistence.mountPath (/data). The old "type: storage" is not a valid type
    # and Gatus silently fell back to memory, losing history on every restart.
    storage:
      type: sqlite
      path: /data/data.db

    metrics: true

    security:
      oidc:
        issuer-url: "https://auth.${DOMAIN}/application/o/gatus/"
        redirect-url: "https://gatus.${DOMAIN}/authorization-code/callback"
        client-id: "$${OIDC_CLIENT_ID}"
        client-secret: "$${OIDC_CLIENT_SECRET}"
        scopes: ["openid"]

    # Alerts: Gatus does not notify the endpoints below directly. Each one
    # carries two extra labels on its Prometheus metrics, and the EndpointDown
    # rule (apps/prometheus/prometheusrule-endpoints.yaml) turns failures into
    # Alertmanager alerts, routed by severity and held back while the
    # namespace is being updated:
    #   severity          critical: users are affected (Telegram with sound)
    #                     warning:  degraded or internal (silent, daytime)
    #                     info:     no notification, status page only
    #   target_namespace  namespace of the checked service
    # Only the "Alerting" group keeps a direct Telegram alert: it watches the
    # Prometheus -> Alertmanager path the other alerts depend on.
    alerting:
      # Token and chat id come as env vars from the gatus-secrets secret (see
      # helm-release.yaml) and Gatus expands them: the double dollar sign keeps
      # Flux postBuild from substituting them, as for the OIDC credentials.
      telegram:
        token: "$${TELEGRAM_BOT_TOKEN}"
        id: "$${TELEGRAM_CHAT_ID}"
        default-alert:
          description: "health check failed"
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 4

    # UI Configuration
    ui:
      title: "Services Status"
      header: "Monitoring Infrastructure"

    endpoints:
      # ========================================
      # 🌐 SERVIZI PUBBLICI (HTTPS)
      # ========================================
      # Hosts without a route get a real 404 from the Traefik catch-all
      # (infrastructure/traefik/catch-all.yaml), so [STATUS] == 200 fails
      # when a route disappears.
      # Certificate threshold: cert-manager renews the wildcard certificate
      # 30 days (720h) before expiry, so "> 720h" failed at every renewal;
      # 336h (14 days, as CertManagerCertExpiringSoon) only fails if the
      # renewal is stuck.
      - name: "Authentik SSO"
        group: "Public Services"
        url: "https://auth.${DOMAIN}"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 336h"
          - "[RESPONSE_TIME] < 3000"
        extra-labels:
          severity: "critical"
          target_namespace: "authentik"

      - name: "Gatus Dashboard"
        group: "Public Services"
        url: "https://gatus.${DOMAIN}"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 336h"
          - "[RESPONSE_TIME] < 2000"
        extra-labels:
          severity: "warning"
          target_namespace: "gatus"

      - name: "Home Assistant"
        group: "Public Services"
        url: "https://home.${DOMAIN}"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 336h"
          - "[RESPONSE_TIME] < 3000"
        extra-labels:
          severity: "critical"
          target_namespace: "home-assistant"

      - name: "Immich Photos"
        group: "Public Services"
        url: "https://immich.${DOMAIN}"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 336h"
          - "[RESPONSE_TIME] < 4000"
        extra-labels:
          severity: "warning"
          target_namespace: "immich"

      # The shop has its own certificate, not the wildcard one. WordPress
      # answers 302 to its installer while the database is empty and 200 once
      # the site is restored: both prove that the certificate, the route, PHP
      # and MariaDB work, while a database error is a 500. The redirect is not
      # followed because the Gateway blocks the installer with a 403.
      - name: "Merlo Fiorillo Shop"
        group: "Public Services"
        url: "https://shop.merlofiorillo.it"
        interval: 2m
        client:
          ignore-redirect: true
        conditions:
          - "[STATUS] == any(200, 302)"
          - "[CERTIFICATE_EXPIRATION] > 336h"
          - "[RESPONSE_TIME] < 4000"
        extra-labels:
          severity: "critical"
          target_namespace: "merlofiorillo-shop"

      # ========================================
      # 🚦 GATEWAY & INGRESS
      # ========================================
      # The web entrypoint (:80) always answers 301 to https. Following the
      # redirect, Gatus failed TLS verification because the wildcard certificate
      # does not cover internal hostnames: the redirect is not followed and the
      # 301 is the proof that Traefik answers.
      - name: "Traefik Gateway"
        group: "Gateway"
        url: "http://traefik.traefik.svc.cluster.local:80"
        interval: 30s
        client:
          ignore-redirect: true
        conditions:
          - "[STATUS] == 301"
          - "[RESPONSE_TIME] < 300"
        extra-labels:
          severity: "critical"
          target_namespace: "traefik"

      # MetalLB VIP of the traefik Service (metallb.io/loadBalancerIPs in
      # infrastructure/traefik/helm-release.yaml). From inside the cluster the
      # VIP is routed by kube-proxy: the check verifies that it is assigned and
      # answering, not the L2 announcement on the LAN.
      - name: "Traefik LoadBalancer"
        group: "Gateway"
        url: "http://192.168.178.10"
        interval: 30s
        client:
          ignore-redirect: true
        conditions:
          - "[STATUS] == 301"
        extra-labels:
          severity: "critical"
          target_namespace: "traefik"

      # ========================================
      # 🔐 AUTHENTICATION & AUTHORIZATION
      # ========================================
      - name: "Authentik Server"
        group: "Auth"
        url: "http://authentik-server.authentik.svc.cluster.local"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        extra-labels:
          severity: "critical"
          target_namespace: "authentik"

      - name: "Authentik Outpost"
        group: "Auth"
        url: "http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 204"
          - "[RESPONSE_TIME] < 1000"
        extra-labels:
          severity: "warning"
          target_namespace: "authentik"

      - name: "Authentik PostgreSQL"
        group: "Auth"
        url: "tcp://authentik-postgresql.authentik.svc.cluster.local:5432"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "critical"
          target_namespace: "authentik"

      # ========================================
      # 🏠 HOME AUTOMATION
      # ========================================
      - name: "Home Assistant Internal"
        group: "Home Automation"
        url: "http://home-assistant.home-assistant.svc.cluster.local:8080"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[RESPONSE_TIME] < 2000"
        extra-labels:
          severity: "critical"
          target_namespace: "home-assistant"

      - name: "MQTT Mosquitto"
        group: "Home Automation"
        url: "tcp://mosquitto.mqtt.svc.cluster.local:1883"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "critical"
          target_namespace: "mqtt"

      - name: "Zigbee2MQTT"
        group: "Home Automation"
        url: "http://zigbee2mqtt.zigbee2mqtt.svc.cluster.local:8080"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "critical"
          target_namespace: "zigbee2mqtt"

      - name: "Ikea Obegraensad"
        group: "Home Automation"
        url: "http://ikea-led.lan/api/info"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "info"

      # ========================================
      # 📸 IMMICH
      # ========================================
      - name: "Immich Server"
        group: "Immich"
        url: "http://immich-server.immich.svc.cluster.local:2283"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        extra-labels:
          severity: "warning"
          target_namespace: "immich"

      - name: "Immich Machine Learning"
        group: "Immich"
        url: "http://immich-machine-learning.immich.svc.cluster.local:3003/ping"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
        extra-labels:
          severity: "warning"
          target_namespace: "immich"

      - name: "Immich PostgreSQL"
        group: "Immich"
        url: "tcp://immich-pg-rw.immich.svc.cluster.local:5432"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "warning"
          target_namespace: "immich"

      - name: "Immich Valkey (Redis)"
        group: "Immich"
        url: "tcp://immich-valkey.immich.svc.cluster.local:6379"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "warning"
          target_namespace: "immich"

      # ========================================
      # 🛒 MERLO FIORILLO SHOP
      # ========================================
      - name: "Merlo Fiorillo MariaDB"
        group: "Merlo Fiorillo Shop"
        url: "tcp://wordpress-mariadb.merlofiorillo-shop.svc.cluster.local:3306"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "critical"
          target_namespace: "merlofiorillo-shop"

      # ========================================
      # ☸️ KUBERNETES CORE
      # ========================================
      # - name: "Kubernetes API"
      #   group: "Cluster Core"
      #   url: "https://kubernetes.default.svc.cluster.local/healthz"
      #   interval: 30s
      #   client:
      #     insecure: true
      #   conditions:
      #     - "[STATUS] == 200"
      #     - "[BODY] == ok"
      #     - "[RESPONSE_TIME] < 500"

      - name: "CoreDNS"
        group: "Cluster Core"
        url: "udp://kube-dns.kube-system.svc.cluster.local:53"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "critical"
          target_namespace: "kube-system"

      # ========================================
      # 🔧 INFRASTRUCTURE
      # ========================================
      - name: "Cert-Manager"
        group: "Infrastructure"
        url: "http://cert-manager.cert-manager.svc.cluster.local:9402/metrics"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
        extra-labels:
          severity: "warning"
          target_namespace: "cert-manager"

      - name: "Cert-Manager Webhook"
        group: "Infrastructure"
        url: "http://cert-manager-webhook.cert-manager.svc.cluster.local:443"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "warning"
          target_namespace: "cert-manager"

      - name: "MetalLB Controller"
        group: "Infrastructure"
        url: "http://metallb-webhook-service.metallb.svc.cluster.local:443"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "warning"
          target_namespace: "metallb"

      - name: "CNPG Controller"
        group: "Infrastructure"
        url: "http://cnpg-webhook-service.cnpg-system.svc.cluster.local:443"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"
        extra-labels:
          severity: "warning"
          target_namespace: "cnpg-system"

      # ========================================
      # 🚨 ALERTING
      # ========================================
      # Direct Telegram alerts, independent of Alertmanager: if Prometheus or
      # Alertmanager stop, no other alert can reach Telegram. info keeps them
      # out of EndpointDown, so they are never notified twice.
      - name: "Prometheus"
        group: "Alerting"
        url: "http://kube-prometheus-stack-prometheus.prometheus.svc.cluster.local:9090/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
        extra-labels:
          severity: "info"
          target_namespace: "prometheus"

      - name: "Alertmanager"
        group: "Alerting"
        url: "http://kube-prometheus-stack-alertmanager.prometheus.svc.cluster.local:9093/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: telegram
        extra-labels:
          severity: "info"
          target_namespace: "prometheus"

      # ========================================
      # 🌍 EXTERNAL DEPENDENCIES
      # ========================================
      - name: "Internet (Cloudflare DNS)"
        group: "External"
        url: "https://1.1.1.1"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        extra-labels:
          severity: "info"

      - name: "GitHub"
        group: "External"
        url: "https://github.com"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
        extra-labels:
          severity: "info"

      - name: "Docker Hub"
        group: "External"
        url: "https://hub.docker.com"
        interval: 10m
        conditions:
          - "[STATUS] == 200"
        extra-labels:
          severity: "info"
