apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.22.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  # Upgrade strategy: ricreare le risorse se cambiano i selector
  # (necessario per StatefulSet di Prometheus/Alertmanager se modifichiamo storage)
  install:
    crds: Skip
    timeout: 10m
  upgrade:
    crds: Skip
    timeout: 10m
    remediation:
      retries: 3
  values:
    # Grafana è gestita separatamente in apps/grafana
    grafana:
      enabled: false

    # ----------------------------------------------------------------
    # Prometheus
    # ----------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # Permette di scrapare ServiceMonitor in qualsiasi namespace,
        # non solo quelli con il label `release: kube-prometheus-stack`
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false

        # Retention dati
        retention: 30d
        retentionSize: "18GB"

        # Persistenza su NFS-flash (SSD ZFS pool)
        # Crea automaticamente PVC `prometheus-kube-prometheus-stack-prometheus-db-...`
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: nfs-flash
              resources:
                requests:
                  storage: 20Gi

        # Lasciamo headroom prima di kill OOM
    # ----------------------------------------------------------------
    # Alertmanager — config completa nel Secret SOPS "alertmanager-config"
    # (contiene bot_token, chat_id, routing — tutto cifrato)
    # ----------------------------------------------------------------
    alertmanager:
      enabled: true
      alertmanagerSpec:
        # L'intera configurazione Alertmanager viene dal Secret
        # "alertmanager-config" (chiave: alertmanager.yaml).
        configSecret: alertmanager-config

        # Dead man's switch: prepared, NOT enabled.
        # Watchdog fires all the time and the secret routes it to the "null"
        # receiver, so nothing notices when Prometheus, Alertmanager or the
        # whole cluster stop. To enable it, create an external check first
        # (for example on healthchecks.io: period 1 minute, grace 10 minutes,
        # notifications to Telegram or e-mail), then edit
        # secret-alertmanager-config.sops.yaml with sops and, inside
        # alertmanager.yaml:
        # 1. add this route as the first entry of route.routes (the existing
        #    "null" route still catches InfoInhibitor):
        #      - receiver: heartbeat
        #        matchers:
        #          - alertname="Watchdog"
        #        group_wait: 0s
        #        group_interval: 1m
        #        repeat_interval: 1m
        # 2. add the receiver; the ping URL is a credential, so it only goes
        #    into the encrypted secret, never in this file:
        #      - name: heartbeat
        #        webhook_configs:
        #          - url: "https://hc-ping.com/<CHECK-UUID>"
        #            send_resolved: false

        retention: 168h  # 7 giorni di storia notifiche
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: nfs-flash
              resources:
                requests:
                  storage: 2Gi

    # ----------------------------------------------------------------
    # Componenti accessori
    # ----------------------------------------------------------------
    kubeStateMetrics:
      enabled: true

    nodeExporter:
      enabled: true

    # ----------------------------------------------------------------
    # Talos Linux: these components don't expose metrics in the
    # standard way. Disable their ServiceMonitors to avoid
    # TargetDown/KubeProxyDown false positives.
    # ----------------------------------------------------------------
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
