apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zfs-and-storage
  namespace: prometheus
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # ------------------------------------------------------------------
    # ZFS pools on Proxmox (host: 192.168.178.162, zfs_exporter :9134)
    # Metrics: zfs_pool_health, zfs_pool_allocated_bytes,
    #          zfs_pool_size_bytes
    # zfs_exporter 2.3.11 exposes no vdev error counters and no scrub
    # timestamps, so ZfsPoolErrors (zfs_pool_*_errors_total) and
    # ZfsScrubOverdue (zfs_pool_scrub_last_finish_seconds) were removed:
    # they had 0 series and could never fire. Add them back together with a
    # collector on the host that exports those metrics.
    # A down exporter raises the chart's TargetDown (warning).
    # ------------------------------------------------------------------
    - name: zfs.proxmox
      rules:
        - alert: ZfsPoolNotHealthy
          # 0 = ONLINE; any other value = DEGRADED/FAULTED/UNAVAIL
          expr: zfs_pool_health != 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} is not ONLINE"
            description: "Health value: {{ $value }}. Run `zpool status {{ $labels.pool }}` on Proxmox."

        - alert: ZfsPoolAlmostFull
          expr: zfs_pool_allocated_bytes / zfs_pool_size_bytes > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.pool }} is more than 80% full"
            description: "Used: {{ $value | humanizePercentage }}. Plan a cleanup or an expansion."

        - alert: ZfsPoolAlmostFull
          expr: zfs_pool_allocated_bytes / zfs_pool_size_bytes > 0.90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} is more than 90% full"
            description: "Used: {{ $value | humanizePercentage }}. ZFS performance drops sharply above 90%."

    # ------------------------------------------------------------------
    # No PVC fill alerts. Every PVC is on NFS (nfs-flash, nfs-spacex) and
    # the kubelet reports the free space of the whole exported dataset, the
    # same number for every PVC on it: one full pool raised one alert per PVC
    # on top of ZfsPoolAlmostFull. PvcAlmostFull, PvcCritical and
    # PvcInodesAlmostFull were removed, and the chart's
    # KubePersistentVolumeFillingUp and KubePersistentVolumeInodesFillingUp
    # are disabled in the values. Add them back for a storage class with
    # per-volume quotas.
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # NFS client on the Talos nodes, mounts from Proxmox
    # ------------------------------------------------------------------
    - name: nfs.client
      rules:
        - alert: NfsTimeouts
          # node_nfs_requests_total has no status label, so the old selector
          # {status="timeout"} matched 0 series. The NFS client retransmits an
          # RPC each time a request times out: count the retransmissions.
          # Warning: slow storage is a symptom; NfsServerUnreachable is the
          # outage.
          expr: increase(node_nfs_rpc_retransmissions_total[10m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NFS timeouts on {{ $labels.instance }}"
            description: "The NFS client keeps retransmitting requests. Check 192.168.178.162 and the NFS server."

        - alert: NfsServerUnreachable
          # Every node with NFS mounts had traffic in the last hour and none
          # for 30 minutes: a global stall.
          # sum() instead of count(... > 0) == 0: count() of an empty vector
          # returns no sample rather than 0, so the old condition never matched.
          expr: |
            sum(rate(node_nfs_requests_total[5m])) == 0
              and count(max_over_time(rate(node_nfs_requests_total[1h])[1h:5m]) > 0) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No NFS traffic from any node"
            description: "No node has sent NFS requests for 30 minutes. Check 192.168.178.162 and the NFS server."
