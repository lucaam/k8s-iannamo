  - helm-repository.yaml
  - helm-release.yaml
  - servicemonitor-kubelet.yaml
  - servicemonitor-zfs.yaml
  - zfs-service.yaml
  - zfs-endpoints.yaml
  - servicemonitor-node-exporter.yaml
  - node-exporter-service.yaml
  - node-exporter-endpoints.yaml
  - servicemonitor-cert-manager.yaml
