# Cluster alerts that the default rules of kube-prometheus-stack do not cover.
#
# Severity policy (routing in apps/prometheus/helm-release.yaml):
#   critical  users or data are affected now: Telegram with sound, any hour.
#   warning   needs a fix within a day: silent Telegram, waking hours only.
#   info      context only: Alertmanager UI, no notification.
#
# Removed duplicates of the chart defaults, which are maintained upstream and
# carry runbook links:
#   NodeNotReady                -> KubeNodeNotReady (critical, 5m, in values)
#   NodeCpuSaturated            -> NodeCPUHighUsage (info)
#   PodCrashLooping             -> KubePodCrashLooping. The old rule fired on
#                                  any restart within 15 minutes (leader
#                                  election restarts of kube-scheduler and
#                                  kube-controller-manager); the default one
#                                  needs a real CrashLoopBackOff.
#   PodNotReady                 -> KubePodNotReady
#   DeploymentReplicasMismatch  -> KubeDeploymentReplicasMismatch
#   StatefulSetReplicasMismatch -> KubeStatefulSetReplicasMismatch
#   AlertmanagerConfigInconsistent -> the chart rule of the same name
#   NodeMemoryHigh              -> NodeMemoryHighUtilization on the Talos
#                                  nodes, NodeMemoryPressure below for the
#                                  Proxmox host too.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-health
  namespace: prometheus
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: nodes
      rules:
        # The Proxmox host runs at 85-95% memory by design: the VMs take
        # almost all of it and the ZFS ARC is not counted as available, so a
        # usage threshold fired for days. Pressure stall information measures
        # the real problem: tasks waiting for memory.
        - alert: NodeMemoryPressure
          expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Memory pressure on {{ $labels.instance }}"
            description: "Tasks on {{ $labels.instance }} spend {{ $value | humanizePercentage }} of the time waiting for memory."

        # Covers the Proxmox host too: the chart rules only select
        # job="node-exporter", so NodeFilesystemAlmostOutOfSpace is disabled
        # in the values to avoid double alerts on the Talos nodes.
        # Excluded: ZFS datasets (the ZfsPoolAlmostFull alerts watch the
        # pools), pmxcfs and lxcfs (fuse), read-only Talos images (rootfs) and
        # memory-backed filesystems.
        - alert: NodeFilesystemAlmostFull
          expr: |
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|fuse.*|rootfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|fuse.*|rootfs"} < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is below 10% free"
            description: "Free space: {{ $value | humanizePercentage }}."

        - alert: NodeFilesystemAlmostFull
          expr: |
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|fuse.*|rootfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|zfs|fuse.*|rootfs"} < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is below 5% free"
            description: "Free space: {{ $value | humanizePercentage }}. Writes will start to fail."

        # Covers the Proxmox host too; NodeClockSkewDetected is disabled in
        # the values for the same reason as above.
        - alert: NodeClockSkew
          expr: abs(node_timex_offset_seconds) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Clock of {{ $labels.instance }} is off by more than 0.5s"
            description: "NTP offset: {{ $value | humanizeDuration }}. TLS and etcd are sensitive to clock skew."

    - name: workload
      rules:
        # The memory limits are sized from 30-day usage; an OOM kill means a
        # limit is too tight. KubePodCrashLooping only fires if the kills
        # go on for 15 minutes.
        - alert: ContainerOOMKilled
          expr: |
            (kube_pod_container_status_restarts_total
              - kube_pod_container_status_restarts_total offset 15m >= 1)
            and ignoring (reason)
            min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[15m]) == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM killed"
            description: "The container hit its memory limit and was restarted. Check the limit against its usage."

    - name: certificates
      rules:
        # cert-manager renews 30 days before expiry: 14 days left means the
        # renewal is stuck. A certificate that was never issued reports an
        # expiration of 0: "> 0" keeps it out of these two alerts, and
        # CertManagerCertNotReady covers it.
        - alert: CertManagerCertExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds > 0) - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days"
            description: "Expires in {{ $value | humanizeDuration }}. Check the Certificate and its CertificateRequest."

        - alert: CertManagerCertExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds > 0) - time() < 7 * 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 7 days"
            description: "Expires in {{ $value | humanizeDuration }}. Check the Certificate and its CertificateRequest."

        - alert: CertManagerCertNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"

    - name: meta
      rules:
        # Without kube-state-metrics no workload alert can fire, without
        # Gatus no EndpointDown. absent() also catches a job without any
        # target, for example a Deployment scaled to zero. The generic
        # TargetDown (warning) is inhibited while this one fires.
        - alert: AlertSourceDown
          expr: |
            sum by (job) (up{job=~"kube-state-metrics|gatus"}) == 0
              or absent(up{job="kube-state-metrics"})
              or absent(up{job="gatus"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} is down"
            description: "Prometheus cannot scrape {{ $labels.job }}: the alerts built on its metrics cannot fire."
