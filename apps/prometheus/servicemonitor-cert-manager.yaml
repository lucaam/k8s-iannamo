apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: prometheus
  labels:
    release: prometheus
spec:
  # Scrapes the cert-manager controller, which exports the
  # certmanager_certificate_* metrics used by the CertManagerCert* rules in
  # prometheusrule-cluster.yaml. If the cert-manager HelmRelease enables
  # prometheus.servicemonitor.enabled later, delete this file to avoid
  # scraping the same target twice.
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  namespaceSelector:
    matchNames:
      - cert-manager
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      # Keep the namespace label of the metric (the namespace of the
      # Certificate) instead of the namespace of the cert-manager pod, so
      # the rule annotations show the right namespace/name.
      honorLabels: true
