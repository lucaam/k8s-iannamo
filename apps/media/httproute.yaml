# Every UI sits behind Authentik forward auth and also keeps its own login.
# The forward auth runs in single-application mode, so each hostname needs a
# Proxy Provider in Authentik; until it exists the outpost denies the request.
# On first start SoulSync and Prowlarr let whoever reaches them create the
# admin account, which forward auth keeps to Authentik users.

# SoulSync: the library, the player and the main UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soulsync
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "soulsync.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: soulsync
          port: 8008
---
# slskd web UI, for searches and transfers outside SoulSync.
