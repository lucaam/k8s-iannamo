apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-matter-server
  namespace: home-assistant-matter-server
spec:
  interval: 15m
  chart:
    spec:
      chart: home-assistant-matter-server
      version: "4.4.4"
      sourceRef:
        kind: HelmRepository
        name: wittdennis
        namespace: flux-system

  postRenderers:
    - kustomize:
        patches:
          # The chart has no value for the priority class.
          - target:
              kind: StatefulSet
              name: home-assistant-matter-server
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-critical
          - target:
              kind: Service
              name: home-assistant-matter-server
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  metallb.io/address-pool: external-pool
                  metallb.io/loadBalancerIPs: 192.168.178.14
          # The chart hardcodes a privileged container that may escalate
          # privileges. The server needs neither: it mounts no host devices
          # (Bluetooth commissioning is off), and on the host network it only
          # uses UDP sockets, mDNS multicast and /data, which root owns. So
          # drop every capability and keep the rest of the chart's settings
          # (root, read-only root filesystem, RuntimeDefault seccomp).
          # The former patches targeted a Deployment, but the chart renders
          # a StatefulSet, so they never applied.
          - target:
              kind: StatefulSet
              name: home-assistant-matter-server
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: home-assistant-matter-server
              spec:
                template:
                  spec:
                    containers:
                      - name: home-assistant-matter-server
                        securityContext:
                          privileged: false
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop:
                              - ALL

  values:
    image:
      repository: matter-js/matterjs-server
      pullPolicy: IfNotPresent
      tag: "1.6.0"

    log:
      logLevel: info

    bluetoothCommissioning:
      enabled: false

    service:
      type: LoadBalancer
      port: 5580

    port: 5580
    networkInterface: eth0

    persistence:
      storageClassName: nfs-spacex
      size: 2Gi

    # No CPU limit on purpose: CFS throttling makes probes fail during bursts.
    resources:
      requests:
        cpu: 20m
        memory: 256Mi
      limits:
        memory: 512Mi

    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
