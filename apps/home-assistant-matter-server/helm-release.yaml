apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-matter-server
  namespace: home-assistant-matter-server
spec:
  interval: 15m
  chart:
    spec:
      chart: home-assistant-matter-server
      version: "4.2.1"
      sourceRef:
        kind: HelmRepository
        name: wittdennis
        namespace: flux-system
  values:
    image:
      repository: matter-js/matterjs-server   # il chart antepone già ghcr.io
      pullPolicy: IfNotPresent
      tag: "1.4.0"

    log:
      logLevel: info
      logLevelSDK: progress

    bluetoothCommissioning:
      enabled: false

    service:
      type: LoadBalancer
      port: 5580
      annotations:
        metallb.io/address-pool: external-pool
        metallb.io/loadBalancerIPs: 192.168.178.14

    # Matter richiede mDNS/multicast sulla LAN
    hostNetwork: true
    hostPort: true

    persistence:
      storageClassName: nfs-spacex
      size: 2Gi

    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: false
      runAsUser: 0

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false

    resources:
      requests:
        cpu: "13m"
        memory: "160Mi"

    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
