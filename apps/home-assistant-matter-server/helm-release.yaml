apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-matter-server
  namespace: home-assistant-matter-server
spec:
  interval: 15m
  chart:
    spec:
      chart: home-assistant-matter-server
      version: "4.4.4"
      sourceRef:
        kind: HelmRepository
        name: wittdennis
        namespace: flux-system

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: home-assistant-matter-server
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  metallb.io/address-pool: external-pool
                  metallb.io/loadBalancerIPs: 192.168.178.14
          - target:
              kind: Deployment
              name: home-assistant-matter-server
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: false
          - target:
              kind: Deployment
              name: home-assistant-matter-server
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  fsGroup: 1000
                  runAsNonRoot: false
                  runAsUser: 0

  values:
    image:
      repository: matter-js/matterjs-server
      pullPolicy: IfNotPresent
      tag: "1.5.5"

    log:
      logLevel: info

    bluetoothCommissioning:
      enabled: false

    service:
      type: LoadBalancer
      port: 5580

    port: 5580
    networkInterface: eth0

    persistence:
      storageClassName: nfs-spacex
      size: 2Gi

    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
