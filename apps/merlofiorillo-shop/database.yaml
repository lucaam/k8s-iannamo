
apiVersion: v1
kind: Service
metadata:
  name: wordpress-mariadb
  namespace: merlofiorillo-shop
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: merlofiorillo-shop
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wordpress-mariadb
  namespace: merlofiorillo-shop
  labels:
    app.kubernetes.io/name: wordpress-mariadb
    app.kubernetes.io/instance: merlofiorillo-shop
    app.kubernetes.io/component: database
spec:
  serviceName: wordpress-mariadb
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress-mariadb

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-mariadb
        app.kubernetes.io/instance: merlofiorillo-shop
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 120

      # The image runs as mysql (999) instead of starting as root: with every
      # capability dropped, root could neither chown the data directory nor
      # switch user with gosu. fsGroup makes the NFS volume writable: the
      # CSIDriver has fsGroupPolicy File.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mariadb
          image: mariadb:11.8.9
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MARIADB_DATABASE
              value: wordpress

            - name: MARIADB_USER
              value: wordpress

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-password

            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-root-password

            # Runs mariadb-upgrade when Renovate moves the image to a newer
            # release, so the system tables follow the server version.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"

            - name: TZ
              value: Europe/Rome

          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp

          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: mariadb-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
