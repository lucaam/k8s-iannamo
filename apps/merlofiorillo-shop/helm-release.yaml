apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: merlofiorillo-shop
spec:
  interval: 30m
  # On its first start WordPress copies its files to the empty NFS volume
  # before Apache starts: more than the default 5 minutes would make the
  # install remediation uninstall it in the middle of the copy.
  timeout: 15m

  chart:
    spec:
      chart: wordpress
      version: "0.16.9"
      sourceRef:
        kind: HelmRepository
        name: groundhog2k
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    fullnameOverride: wordpress

    replicaCount: 1

    image:
      registry: docker.io
      repository: wordpress
      tag: "7.1.5-php8.3-apache"
      pullPolicy: IfNotPresent

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      fsGroup: 33
      # wp-content can hold many thousands of files: skip the recursive
      # chgrp of the NFS volume when its root already has the right group.
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
          - ALL

    service:
      type: ClusterIP
      port: 80

    # The chart writes these values into its own Secret, and b64enc fails on a
    # missing key: the password stays empty here and comes from the SOPS
    # Secret through env below, which takes precedence over envFrom.
    externalDatabase:
      host: wordpress-mariadb.merlofiorillo-shop.svc.cluster.local
      name: wordpress
      user: wordpress
      password: ""

    env:
      - name: WORDPRESS_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: wordpress-secrets
            key: mariadb-password
      - name: TZ
        value: Europe/Rome

    storage:
      persistentVolumeClaimName: wordpress-data
      accessModes:
        - ReadWriteMany
      keepPvc: true

    settings:
      maxFileUploadSize: 128M
      memoryLimit: 512M

    # The chart probes /wp-login.php and /wp-admin/install.php. A restored
    # site may hide or block the login page (for example with a security
    # plugin), and the liveness probe would then restart the pod forever:
    # startup and liveness only check that Apache accepts connections, while
    # readiness checks that PHP answers and reaches the database.
    customStartupProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 60
    customLivenessProbe:
      tcpSocket:
        port: http
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
    customReadinessProbe:
      httpGet:
        path: /wp-admin/install.php
        port: http
        httpHeaders:
          - name: Host
            value: shop.merlofiorillo.it
          - name: X-Forwarded-Proto
            value: https
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
