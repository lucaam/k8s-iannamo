apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: merlofiorillo-shop
spec:
  interval: 30m

  chart:
    spec:
      chart: wordpress
      version: "0.16.7"
      sourceRef:
        kind: HelmRepository
        name: groundhog2k
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    fullnameOverride: wordpress

    replicaCount: 1

    image:
      registry: docker.io
      repository: wordpress
      tag: "7.1.3-php8.3-apache"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 80

    externalDatabase:
      host: wordpress-mariadb.merlofiorillo-shop.svc.cluster.local
      name: wordpress
      user: wordpress

    extraEnvSecrets:
      - wordpress-secrets

    storage:
      persistentVolumeClaimName: wordpress-data
      accessModes:
        - ReadWriteMany
      keepPvc: true

    settings:
      maxFileUploadSize: 128M
      memoryLimit: 512M

    env:
      - name: TZ
        value: Europe/Rome

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
