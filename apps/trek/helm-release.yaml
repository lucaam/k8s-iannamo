apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
  namespace: trek
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/trek
      # Defaults to spec.interval (5m). A new GitRepository artifact requeues
      # the HelmChart anyway, so hourly is enough.
      interval: 1h
      sourceRef:
        kind: GitRepository
        name: trek
        namespace: flux-system

  values:
    image:
      repository: mauriceboe/trek
      tag: 5.2.0@sha256:ca317266c71e79bc58123f49e5ddbf2b8549a255f01a73d510b9a18b5ef135b2
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 20m
        memory: 448Mi
      limits:
        # null removes the chart's default 500m CPU limit, which throttled trek.
        cpu: null
        memory: 768Mi

    service:
      type: ClusterIP
      port: 3000

    env:
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: "https://trek.${DOMAIN}"
      APP_URL: "https://trek.${DOMAIN}"
      FORCE_HTTPS: "true"
      TRUST_PROXY: "1"
      MCP_RATE_LIMIT: "300"
      MCP_MAX_SESSION_PER_USER: "20"
      OIDC_ISSUER: "https://auth.${DOMAIN}"
      OIDC_ADMIN_CLAIM: "trip admins"
      OIDC_DISCOVERY_URL: "https://auth.${DOMAIN}/application/o/trek/.well-known/openid-configuration"
      # OIDC_CLIENT_SECRET does not go here: it comes from the Secret set in existingSecret below

    existingSecret: trek-secret
    existingSecretKey: JWT_SECRET   # key of trek-secret the chart reads ENCRYPTION_KEY from

    persistence:
      enabled: true
      data:
        existingClaim: trek-data
      uploads:
        existingClaim: trek-uploads
