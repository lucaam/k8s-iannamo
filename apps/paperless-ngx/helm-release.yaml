apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  releaseName: paperless-ngx
  chart:
    spec:
      chart: paperless-ngx
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: paperless-ngx
        namespace: flux-system
  interval: 1h
  targetNamespace: paperless-ngx
  values:
    paperlessAi:
      enabled: true
      env:
        - name: AI_PROVIDER
          value: "ollama"
        - name: OLLAMA_API_URL
          value: "http://ollama.ollama.svc.cluster.local:11434"
        - name: OLLAMA_MODEL
          value: "llama3.2:3b"
        - name: AI_REQUEST_TIMEOUT
          value: "300"
    # Persistenza dati Paperless-ngx (PVC `paperless-ngx`)
    persistence:
      enabled: true
      storageClass: nfs-flash

    app:
      url: "https://paperless.${DOMAIN}"
      timeZone: "Europe/Rome"

      database:
        host: "paperless-db-rw"
        name: "paperless"
        user: "paperless"
        port: 5432
        existingSecret: "paperless-db-secret"
        existingSecretKey: "password"

      oidc:
        enabled: true
        providerId: "authentik"
        displayName: "Authentik SSO"
        # Format richiesto da Paperless: base URL dell'app OIDC in Authentik,
        # con slug e slash finale (NON solo l'origine, NON il discovery URL completo)
        serverUrl: "https://auth.${DOMAIN}/application/o/paperless/"
        existingSecret: "paperless-oidc-secret"
        clientIdKey: "client-id"
        clientSecretKey: "client-secret"
        disableRegularLogin: false
        redirectLoginToSSO: false

    extraEnv:

        # --- AI / Ollama ---
        - name: PAPERLESS_AI_ENABLED
          value: "true"
        - name: PAPERLESS_AI_LLM_BACKEND
          value: "ollama"
        # NOTA: la variabile corretta è ENDPOINT, non URL (vedi documentazione)
        - name: PAPERLESS_AI_LLM_ENDPOINT
          value: "http://ollama.ollama.svc.cluster.local:11434"
        - name: PAPERLESS_AI_LLM_MODEL
          value: "llama3.2:3b"
        # Aumenta il timeout per elaborazioni lente su CPU (opzionale)
        - name: PAPERLESS_AI_LLM_TIMEOUT
          value: "300"
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: secret-key

    # Routing gestito via HTTPRoute separato (pattern k8s-iannamo)
    route:
      enabled: false
    ingress:
      enabled: false
