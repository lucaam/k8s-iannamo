apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless-ngx
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: nfs-flash       # esplicito: nessuna SC di default nel cluster
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-secret
