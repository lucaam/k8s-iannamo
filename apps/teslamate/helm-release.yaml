apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: teslamate
spec:
  releaseName: teslamate
  chart:
    spec:
      chart: teslamate
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: teslamate
        namespace: flux-system
  interval: 1h
  targetNamespace: teslamate

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  install:
    remediation:
      retries: 3

  # TeslaMate is parked: the pods are stopped and the database is hibernated,
  # but every piece of data is kept so that the app can be brought back.
  # The CNPG Cluster already carries helm.sh/resource-policy: keep (chart
  # default database.cnpg.keepOnUninstall); the Grafana PVC gets it below,
  # so that removing this HelmRelease later leaves both in place.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PersistentVolumeClaim
              name: teslamate-grafana
            patch: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: teslamate-grafana
                annotations:
                  helm.sh/resource-policy: keep
          - target:
              group: apps
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=teslamate
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0

  values:
    teslamate:
      existingSecret: teslamate-encryption
      existingSecretKey: ENCRYPTION_KEY
      ingress:
        enabled: false

    database:
      type: cnpg
      cnpg:
        # Declarative hibernation: CNPG stops the instances and keeps the PVCs.
        annotations:
          cnpg.io/hibernation: "on"
        storage:
          size: 5Gi
          storageClass: nfs-flash

    grafana:
      enabled: true
      ingress:
        enabled: false

      podSecurityContext:
        fsGroup: 472
        fsGroupChangePolicy: "OnRootMismatch"
      securityContext:
        runAsUser: 472
        runAsGroup: 472

      initChownData:
        enabled: false

      persistence:
        enabled: true
        storageClass: nfs-flash
        accessModes:
          - ReadWriteMany
        size: 1Gi

      # grafana.ini is not supported by chart 0.3.0:
      # all configuration goes through extraEnv (GF_*).

      extraEnv:
        # --- Server ---
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana-teslamate.${DOMAIN}/"

        # --- Basic auth ---
        - name: GF_AUTH_OAUTH_AUTO_LOGIN
          value: "true"
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        - name: GF_AUTH_DISABLE_BASIC_AUTH
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"

        # --- Generic OAuth (Authentik) ---
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: "Authentik"
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: "openid profile email groups"
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: "https://auth.${DOMAIN}/application/o/authorize/"
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: "https://auth.${DOMAIN}/application/o/token/"
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: "https://auth.${DOMAIN}/application/o/userinfo/"
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
          value: "true"

        # --- Credentials from the existing secret ---
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-oidc-secret
              key: client-id
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-oidc-secret
              key: client-secret

    mosquitto:
      enabled: true
