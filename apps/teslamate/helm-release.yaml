apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: teslamate
spec:
  releaseName: teslamate
  chart:
    spec:
      chart: teslamate
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: teslamate
        namespace: flux-system
  interval: 1h
  targetNamespace: teslamate

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  install:
    remediation:
      retries: 3

  values:
    teslamate:
      existingSecret: teslamate-encryption
      existingSecretKey: ENCRYPTION_KEY
      ingress:
        enabled: false

    database:
      type: cnpg
      cnpg:
        storage:
          size: 5Gi
          storageClass: nfs-flash

    grafana:
      enabled: true
      ingress:
        enabled: false

      podSecurityContext:
        fsGroup: 472
        fsGroupChangePolicy: "OnRootMismatch"
      securityContext:
        runAsUser: 472
        runAsGroup: 472

      initChownData:
        enabled: false

      persistence:
        enabled: true
        storageClass: nfs-flash
        accessModes:
          - ReadWriteMany
        size: 1Gi

      grafana.ini:
        server:
          root_url: "https://grafana-teslamate.${DOMAIN}/"

        auth:
          disable_login_form: true
          oauth_auto_login: true
          disable_basic_auth: true

        auth.anonymous:
          enabled: false

        auth.generic_oauth:
          enabled: true
          name: "Authentik"
          client_id: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
          client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
          scopes: "openid profile email groups"
          auth_url: "https://auth.${DOMAIN}/application/o/authorize/"
          token_url: "https://auth.${DOMAIN}/application/o/token/"
          api_url: "https://auth.${DOMAIN}/application/o/userinfo/"
          role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
          allow_assign_grafana_admin: true

      # ✅ extraEnv (lista) invece di env (mappa)
      extraEnv:
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-oidc-secret
              key: client-id
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-oidc-secret
              key: client-secret

    mosquitto:
      enabled: true
