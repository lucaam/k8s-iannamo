apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: teslamate
spec:
  releaseName: teslamate
  chart:
    spec:
      chart: teslamate
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: teslamate
        namespace: flux-system
  interval: 1h
  targetNamespace: teslamate

  # Aggiungi la remediation per evitare che un fallimento blocchi tutto
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    teslamate:
      existingSecret: teslamate-encryption
      existingSecretKey: ENCRYPTION_KEY
      ingress:
        enabled: false

    database:
      type: cnpg
      cnpg:
        storage:
          size: 5Gi
          storageClass: nfs-flash

    grafana:
      enabled: true
      ingress:
        enabled: false

      podSecurityContext:
        fsGroup: 472
        fsGroupChangePolicy: "OnRootMismatch"

      securityContext:
        runAsUser: 472
        runAsGroup: 472

      # Disabilitato: con fsGroup attivo non serve e su NFS fallirebbe
      initChownData:
        enabled: false

      persistence:
        enabled: true
        storageClass: nfs-flash
        accessModes:
          - ReadWriteMany
        size: 1Gi

      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
        auth:
          disable_login_form: true
          disable_signout_menu: true

    mosquitto:
      enabled: true
