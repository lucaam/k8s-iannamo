apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: social-media-reuploader
  namespace: social-media-reuploader
spec:
  interval: 5m
  timeout: 10m
  # The OCI chart of oci-repository.yaml.
  chartRef:
    kind: OCIRepository
    name: social-media-reuploader
    namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    # Client-side apply (three-way merge). The chart moved the bot Deployment to
    # the Recreate strategy; with server-side apply the defaulted
    # spec.strategy.rollingUpdate, owned by no field manager, stays in place and
    # the API server rejects the upgrade (see radius-project/radius#13780). The
    # strategic merge patch clears it (retainKeys). Later upgrades can keep
    # client-side apply: under "auto" they would follow this release anyway.
    serverSideApply: disabled
  # The chart has no value for the priority class.
  postRenderers:
    - kustomize:
        patches:
          # Background work: it can wait and never preempts other pods
          # (see infrastructure/priority-classes).
          - target:
              group: apps
              kind: Deployment
              labelSelector: app.kubernetes.io/instance=social-media-reuploader
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-low
  # The release name contains the chart name, so the resources keep their
  # names (social-media-reuploader, -gui, -data, -sa) without fullnameOverride.
  values:
    image:
      repository: ghcr.io/lucaam/social-media-reuploader
      # Same release as the chart (oci-repository.yaml); the GUI uses the same image.
      tag: "0.9.0@sha256:11a3488403c055e8f626e84f6e36a23db6f798afab933f5d674529eaf0033096"
    # Overrides the resources of the chart's resourceProfile (medium), which also
    # sets a 1 CPU limit. No CPU limit on purpose: it throttled video processing.
    # The profile still sizes the /tmp emptyDir (4Gi) and the grace period (180 s).
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
    secret:
      name: social-media-reuploader-secret
    env:
      # The bot has always run in polling mode: with an empty WEBHOOK_URL the
      # old release fell back to it. Nothing routes Telegram webhooks here.
      MODE: polling
    gui:
      existingSecret: social-media-reuploader-gui-secret
      env:
        # Served only over HTTPS through the Traefik gateway (httproute.yaml).
        SESSION_COOKIE_SECURE: true
        # Must match a redirect URI of the Authentik provider.
        OAUTH_REDIRECT_URI: "https://social-media-reuploader.${DOMAIN}/auth"
    # Merged with the chart defaults: cpu: null drops their 200m CPU limit.
    guiResources:
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        cpu: null
        memory: 256Mi
    # Same claim as before: storage class and size cannot change in place.
    # The chart annotates it with helm.sh/resource-policy: keep.
    db:
      pvc:
        enabled: true
        storageClass: nfs-flash
        size: 1Gi
    metrics:
      serviceMonitor:
        enabled: true
