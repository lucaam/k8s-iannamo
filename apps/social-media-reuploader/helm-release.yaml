apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: social-media-reuploader
  namespace: social-media-reuploader
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./charts/social-media-reuploader
      sourceRef:
        kind: GitRepository
        name: social-media-reuploader
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    serviceAccount:
      create: true
      name: ""
    image:
      repository: ghcr.io/lucaam/social-media-reuploader
      tag: "0.8.1"
      pullPolicy: IfNotPresent
    # Overrides the resources of the chart's resourceProfile (medium), which also sets a 1 CPU limit.
    # No CPU limit on purpose: it throttled video processing.
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
    secret:
      create: false
      name: social-media-reuploader-secret
      botTokenKey: BOT_TOKEN
    env:
      MODE: webhook
      TMP_DIR: "/tmp/telegram_downloader"
      TELEGRAM_MAX_FILE_SIZE: "52428800"
      WORKERS: "2"
      WEBHOOK_URL: ""
    gui:
      enabled: true
      useSecret: true
      secretName: social-media-reuploader-gui-secret
      image:
        repository: ghcr.io/lucaam/social-media-reuploader
        tag: "0.8.1"
        pullPolicy: IfNotPresent
      port: 8081
    # Merged with the chart defaults: cpu: null drops their 200m CPU limit.
    guiResources:
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        cpu: null
        memory: 256Mi
    db:
      pvc:
        enabled: true
        storageClass: nfs-flash
        size: 1Gi
