name: ci-conftest
on:
  pull_request:
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "policy/**"
      - ".github/workflows/ci-conftest.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/pkg/actions/kustomize@2b9f4c54119931dd929e1f47b88ef8ae118fa6c0
      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
      - name: Render
        run: kustomize build apps/ > /tmp/rendered.yaml
      - name: Conftest (warnings only)
        run: conftest test /tmp/rendered.yaml --policy policy/ --all-namespaces --fail-on-warn=false --output standard
