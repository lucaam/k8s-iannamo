# Pull request gate. Every job reports into `ci-gate`, the only required check
# besides GitGuardian. How it works and how to run it locally:
# .github/ci/README.md.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.11.14"
  MISE_SHA256: 6fa596291e9758106f761fea4f8e7fac6c3e7ff4714d5c0b9a76e16068db14f6

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      manifests: ${{ steps.filter.outputs.manifests }}
      full: ${{ steps.filter.outputs.full }}
      docs: ${{ steps.filter.outputs.docs }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the jobs to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: .github/ci/changes.sh

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install_args: uv pipx:yamllint actionlint zizmor node
      - name: yamllint
        run: yamllint --strict --format github .
      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows/
      - name: Dependency review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
      - name: fluxci unit tests
        if: ${{ !cancelled() }}
        run: uv run --quiet --no-project --with pyyaml==6.0.3 python -m unittest discover -s .github/ci -p 'test_*.py'
      - name: Renovate configuration
        if: ${{ !cancelled() && needs.changes.outputs.renovate == 'true' }}
        env:
          RENOVATE_VERSION: "44.263.4"
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global .github/renovate.json
      - name: Documentation
        if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' }}
        run: uv run --quiet --no-project --with-requirements .github/ci/docs-requirements.txt mkdocs build --strict

  manifests:
    name: manifests
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install_args: uv kustomize flux2 kubeconform conftest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kubeconform-cache
          key: kubeconform-${{ hashFiles('.github/ci/config.yaml') }}
          restore-keys: kubeconform-
      - name: Build every Flux Kustomization
        id: build
        run: .github/ci/fluxci build --repo . --out "$RUNNER_TEMP/build"
      - name: Static checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/ci/fluxci check --build "$RUNNER_TEMP/build"
      - name: Schemas and validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          .github/ci/fluxci schemas --repo . --out "$RUNNER_TEMP/schemas" "$RUNNER_TEMP/build"
          .github/ci/fluxci bundle --build "$RUNNER_TEMP/build" --out "$RUNNER_TEMP/bundle"
          .github/ci/fluxci validate --repo . --bundle "$RUNNER_TEMP/bundle" --schemas "$RUNNER_TEMP/schemas" \
            --cache "$RUNNER_TEMP/kubeconform-cache" --label manifests

  render:
    name: render
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      diff: ${{ steps.diff.outputs.diff }}
    env:
      FULL: ${{ needs.changes.outputs.full }}
      ALLOW_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the base revision
        if: github.event_name == 'pull_request'
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install_args: uv kustomize helm flux2 kubeconform conftest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/charts
            ${{ runner.temp }}/kubeconform-cache
          key: render-${{ hashFiles('apps/**/helm-*.yaml', 'infrastructure/**/helm-*.yaml', '.github/ci/config.yaml') }}
          restore-keys: render-
      - name: Build head and base
        id: build
        run: |
          .github/ci/fluxci build --repo . --out "$RUNNER_TEMP/build/head"
          if [ -d "$RUNNER_TEMP/base" ]; then
            .github/ci/fluxci build --repo "$RUNNER_TEMP/base" --config-repo . --out "$RUNNER_TEMP/build/base" \
              --label base --lenient
          fi
      - name: Plan
        id: plan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          args=(--head "$RUNNER_TEMP/build/head" --out "$RUNNER_TEMP/plan.json")
          if [ -d "$RUNNER_TEMP/build/base" ]; then args+=(--base "$RUNNER_TEMP/build/base"); fi
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          .github/ci/fluxci plan "${args[@]}"
      - name: Render the changed HelmReleases
        id: render
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: |
          .github/ci/fluxci render --build "$RUNNER_TEMP/build/head" --plan "$RUNNER_TEMP/plan.json" \
            --side head --out "$RUNNER_TEMP/render/head" --cache "$RUNNER_TEMP/charts"
      - name: Render the base revision
        id: render-base
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          .github/ci/fluxci render --build "$RUNNER_TEMP/build/base" --plan "$RUNNER_TEMP/plan.json" \
            --side base --out "$RUNNER_TEMP/render/base" --cache "$RUNNER_TEMP/charts"
      - name: Schemas and validation
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          .github/ci/fluxci schemas --repo . --out "$RUNNER_TEMP/schemas" "$RUNNER_TEMP/build/head" "$RUNNER_TEMP/render/head"
          .github/ci/fluxci bundle --render "$RUNNER_TEMP/render/head" --out "$RUNNER_TEMP/bundle"
          .github/ci/fluxci validate --repo . --bundle "$RUNNER_TEMP/bundle" --schemas "$RUNNER_TEMP/schemas" \
            --cache "$RUNNER_TEMP/kubeconform-cache" --label rendered
      - name: Data guard
        id: guard
        if: ${{ !cancelled() && steps.render-base.outcome == 'success' }}
        run: |
          args=(--base-build "$RUNNER_TEMP/build/base" --head-build "$RUNNER_TEMP/build/head"
                --base-render "$RUNNER_TEMP/render/base" --head-render "$RUNNER_TEMP/render/head"
                --label data --out "$RUNNER_TEMP/guard.json")
          if [ "$ALLOW_DESTRUCTIVE" = "true" ]; then args+=(--allow); fi
          .github/ci/fluxci guard "${args[@]}"
      - name: Diff report
        id: diff
        if: ${{ !cancelled() && steps.render-base.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/diff"
          .github/ci/fluxci diff --plan "$RUNNER_TEMP/plan.json" \
            --base-build "$RUNNER_TEMP/build/base" --head-build "$RUNNER_TEMP/build/head" \
            --base-render "$RUNNER_TEMP/render/base" --head-render "$RUNNER_TEMP/render/head" \
            --guard "$RUNNER_TEMP/guard.json" --out "$RUNNER_TEMP/diff/comment.md"
          cat "$RUNNER_TEMP/diff/comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "diff=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.diff.outcome == 'success' }}
        with:
          name: fluxci-diff
          path: ${{ runner.temp }}/diff/comment.md
          retention-days: 7

  comment:
    name: diff comment
    needs: render
    # Informative only: not part of ci-gate. Skipped for forks, whose token
    # cannot comment.
    if: >-
      !cancelled() && needs.render.outputs.diff == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fluxci-diff
          path: diff
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- fluxci:diff -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@diff/comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@diff/comment.md > /dev/null
          fi

  ci-gate:
    name: ci-gate
    # Runs whenever the workflow is not cancelled, so failed or skipped jobs
    # are always reported. A run superseded by a newer push or label event is
    # cancelled by the concurrency group: it must not publish a failing
    # ci-gate next to the one of the newer run.
    if: ${{ !cancelled() }}
    needs: [changes, lint, manifests, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results of the gated jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error title=ci-gate::not successful: $failed"
            exit 1
          fi
