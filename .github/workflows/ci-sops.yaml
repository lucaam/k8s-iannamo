name: ci-sops

on:
  pull_request:
    paths:
      - '**.sops.yaml'
      - '**.sops.yml'
      - '.github/workflows/ci-sops.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify all *.sops.yaml/*.sops.yml are encrypted
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            # sops metadata block must exist
            if ! grep -qE '^sops:' "$f"; then
              echo "❌ $f NOT encrypted (no sops metadata)"
              fail=1
              continue
            fi
            # Must have an ENC[AES256_GCM block that is NOT just the `mac:` field
            # (a file with only `mac:` and plaintext data would still pass a naive grep)
            if ! grep -E 'ENC\[AES256_GCM' "$f" | grep -vE '^\s+mac:\s' | grep -q .; then
              echo "❌ $f has only mac ENC, no encrypted values"
              fail=1
              continue
            fi
            echo "✅ $f is encrypted"
          done < <(find apps infrastructure clusters \( -name '*.sops.yaml' -o -name '*.sops.yml' \) -print0 2>/dev/null)
          exit $fail

  decrypt-test:
    runs-on: ubuntu-latest
    needs: check-encrypted
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Skip if no key
        if: env.SOPS_AGE_KEY == ''
        run: echo "⚠️ SOPS_AGE_KEY not set — skipping decrypt test"
      - name: Install sops
        if: env.SOPS_AGE_KEY != ''
        run: |
          curl -sL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          sops --version
      - name: Decrypt test
        if: env.SOPS_AGE_KEY != ''
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if sops --decrypt "$f" > /dev/null 2>&1; then
              echo "✅ $f decrypts OK"
            else
              echo "❌ Cannot decrypt $f"
              fail=1
            fi
          done < <(find apps infrastructure clusters \( -name '*.sops.yaml' -o -name '*.sops.yml' \) -print0 2>/dev/null)
          exit $fail
