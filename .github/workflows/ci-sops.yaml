name: ci-sops

on:
  pull_request:
    paths:
      - '**.sops.yaml'
      - '**.sops.yml'
      - '.github/workflows/ci-sops.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all *.sops.yaml are encrypted
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            grep -qE '^sops:' "$f" || { echo "❌ $f NOT encrypted"; fail=1; }
            grep -qE 'ENC\[AES256_GCM' "$f" || { echo "❌ $f no ENC block"; fail=1; }
          done < <(find apps infrastructure clusters -name '*.sops.yaml' -print0 2>/dev/null)
          exit $fail

  decrypt-test:
    runs-on: ubuntu-latest
    needs: check-encrypted
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no key
        if: env.SOPS_AGE_KEY == ''
        run: echo "⚠️ SOPS_AGE_KEY not set — skipping decrypt test"
      - name: Install sops
        if: env.SOPS_AGE_KEY != ''
        run: |
          curl -sL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          sops --version
      - name: Decrypt test
        if: env.SOPS_AGE_KEY != ''
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if sops --decrypt "$f" > /dev/null 2>&1; then
              echo "✅ $f decrypts OK"
            else
              echo "❌ Cannot decrypt $f"
              fail=1
            fi
          done < <(find apps infrastructure clusters -name '*.sops.yaml' -print0 2>/dev/null)
          exit $fail
