# Data kept on purpose after an app was removed from Git.
#
# Nothing in the cluster deletes data on its own: StorageClasses are Retain
# and Flux never prunes PVCs, namespaces or databases. So every retired app
# gets an entry here with a date. Once retainUntil has passed, the nightly
# ci-main run opens an issue labelled "data-retention", and the data is then
# either deleted by hand (docs/retiring-an-app.en.md) or kept on purpose with
# a new retainUntil. CI never deletes anything.
#
# Entry fields:
#   app:          name of the retired app
#   namespace:    namespace that still holds the data
#   since:        date the app was removed from Git (YYYY-MM-DD)
#   retainUntil:  date after which the data should be deleted (YYYY-MM-DD)
#   reason:       why it was retired
#   data:         what is kept: Kubernetes objects and host directories
retained:
  - app: teslamate
    namespace: teslamate
    since: 2026-11-26
    retainUntil: 2027-02-26
    reason: >-
      Not used for now. Its chart source is gone (oci://ghcr.io/dcardozoo/charts
      answers 401), so bringing it back needs a new chart.
    data:
      - "CNPG Cluster teslamate/teslamate-db: hibernated, helm.sh/resource-policy: keep; it owns the PVCs teslamate-db-1 and teslamate-db-2"
      - "PVC teslamate/teslamate-grafana: helm.sh/resource-policy: keep"
      - "Namespace teslamate: kustomize.toolkit.fluxcd.io/prune: disabled; also holds the CNPG Secrets teslamate-db-*"
      - "Host directories /export/flash/teslamate/{teslamate-db-1,teslamate-db-2,teslamate-grafana}, 23 MB in total"
      - "ENCRYPTION_KEY for the stored Tesla tokens: apps/teslamate/secret-teslamate.sops.yaml in the Git history (pruned from the cluster)"
